name: repo2draw
description: >-
  Zero-AI architecture diagram for README. Statically analyzes your
  repository, renders an x-cmd draw chart URL and syncs it between
  ARCH_DIAGRAM markers in your README (no PNG/SVG binaries committed).
author: qiakai
branding:
  icon: git-branch
  color: green

runs:
  using: composite
  steps:
    - name: Fetch repo2draw scripts
      shell: bash
      run: |
        git clone --depth 1 --branch main \
          https://github.com/qiakai/repo2draw.git \
          "$RUNNER_TEMP/repo2draw-tool"

    - name: Analyze repository
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/repo2draw-tool/scripts/analyze_arch.py" \
          --root . --out "$RUNNER_TEMP/repo2draw-arch.json"

    - name: Build diagram URL
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/repo2draw-tool/scripts/build_diagram.py" \
          "$RUNNER_TEMP/repo2draw-arch.json" --out "$RUNNER_TEMP/repo2draw.url"

    - name: Record URL into README
      shell: bash
      run: |
        args="--url-file $RUNNER_TEMP/repo2draw.url --readme README.md"
        if [ -f README.zh.md ]; then
          args="$args --readme README.zh.md"
        fi
        python3 "$RUNNER_TEMP/repo2draw-tool/scripts/update_readme.py" $args
